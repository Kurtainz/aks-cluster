apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n-db
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/staging/n8n-db
  prune: true
  sourceRef:
    kind: GitRepository
    name: aks-system
    namespace: flux-system
  targetNamespace: n8n
  # This ensures the DB is ready BEFORE the n8n app starts
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: n8n-postgres
      namespace: n8n
