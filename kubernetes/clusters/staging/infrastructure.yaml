apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  force: true
  path: ./kubernetes/infrastructure/controllers/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: aks-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 30s
  path: ./kubernetes/infrastructure/configs/staging
  prune: true
  sourceRef:
    kind: GitRepository
    name: aks-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
