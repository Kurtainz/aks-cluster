apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/staging/n8n
  prune: true
  sourceRef:
    kind: GitRepository
    name: aks-system
    namespace: flux-system
  dependsOn:
  - name: external-secrets
