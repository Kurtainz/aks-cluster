apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  releaseName: external-secrets
  targetNamespace: external-secrets # Installs into your new namespace
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: ">=1.2.1"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    createNamespace: true
  values:
    serviceAccount:
      create: false
      name: external-secrets-sa
