apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: "39.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system

  interval: 1h

  targetNamespace: traefik

  install:
    createNamespace: true

  values:
    deployment:
      replicas: 1

    service:
      type: ClusterIP

    ports:
      web:
        port: 8000
        expose:
          default: true
        exposedPort: 80

      websecure:
        port: 8443
        expose:
          default: true
        exposedPort: 443
