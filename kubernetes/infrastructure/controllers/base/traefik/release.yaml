apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: "39.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  interval: 1h
  install:
    createNamespace: true
  values:
    # Production settings
    deployment:
      replicas: 2
    service:
      annotations:
        # AKS specific: Tells Azure to create a Standard Load Balancer
        service.beta.kubernetes.io/azure-load-balancer-sku: Standard 
    ports:
      web:
        redirectTo:
          port: websecure # Force HTTPS
      websecure:
        tls:
          enabled: true
