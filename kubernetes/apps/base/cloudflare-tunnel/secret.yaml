apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-token
  namespace: flux-system
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: cloudflare-tunnel-token-k8s
    creationPolicy: Owner
  data:
  - secretKey: token
    remoteRef:
      key: cloudflare-tunnel-token
