apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-postgres
  namespace: n8n
spec:
  instances: 1

  storage:
    size: 5Gi

  bootstrap:
    initdb:
      database: n8n
      owner: n8n

  managed:
    roles:
      - name: n8n
        ensure: present
        login: true
        passwordSecret:
          name: n8n-db-credentials
